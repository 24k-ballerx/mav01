services:
  - type: web
    name: school-backend
    env: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "daphne backend.asgi:application -b 0.0.0.0 -p $PORT"
    repo: .
    envVars:
      - key: DJANGO_SECRET_KEY
      - key: DATABASE_URL
      - key: RENDER_DATABASE_URL
      - key: REDIS_URL

  - type: worker
    name: school-backend-worker
    env: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "celery -A backend worker --loglevel=info"
    repo: .
    envVars:
      - key: DJANGO_SECRET_KEY
      - key: DATABASE_URL
      - key: REDIS_URL

  - type: web
    name: school-frontend
    env: node
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm run start"
    envVars:
      - key: NEXT_PUBLIC_API_URL
